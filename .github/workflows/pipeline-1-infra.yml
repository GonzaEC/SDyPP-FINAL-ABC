name: "Pipeline 1 - Infraestructura Hetzner"

# Provisiona el VPS Hetzner con k3s via cloud-init. En push a infra/** solo
# corre `tofu plan` (drift detection); el apply real es manual (dispatch)
# para evitar recrear el server por accidente y perder los PVCs locales.

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "plan (default) o apply"
        required: false
        default: "plan"
        type: choice
        options: [plan, apply]

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml

  tofu:
    name: OpenTofu ${{ github.event.inputs.action || 'plan' }}
    needs: gitleaks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_hcloud_token:   ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - name: Init
        run: tofu init

      - name: Plan
        run: tofu plan -out=plan.tfplan

      - name: Apply
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' }}
        run: tofu apply plan.tfplan
