name: "Pipeline 3 - Aplicaciones"

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Pilar2/P5/**"
      - "k8s/gke/apps/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml

  build-and-push:
    name: Build ${{ matrix.name }}
    needs: gitleaks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            context: ./app
            dockerfile: ./app/Dockerfile
            image: frontend
          - name: nct
            context: ./Pilar2/P5
            dockerfile: ./Pilar2/P5/Dockerfile.api
            image: blockchain-nct
          - name: trp
            context: ./Pilar2/P5
            dockerfile: ./Pilar2/P5/Dockerfile.trp
            image: blockchain-trp
          - name: worker-cpu
            context: ./Pilar2/P5
            dockerfile: ./Pilar2/P5/Dockerfile.cpu
            image: blockchain-worker-cpu
    steps:
      - uses: actions/checkout@v4

      - name: Login to OCIR
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login \
            ${{ secrets.OCIR_REGISTRY }} \
            -u "${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_USERNAME }}" \
            --password-stdin

      # Los nodos OKE son ARM64 (VM.Standard.A1.Flex / Ampere). Buildx + qemu
      # compilan multi-arquitectura desde runners x86; cada imagen suma ~2-4 min.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push (arm64)
        env:
          # NEXT_PUBLIC_* se inlinean en build time por Next.js — solo
          # se pasan cuando el target es el frontend.
          CLOUDINARY_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
        run: |
          IMAGE="${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ matrix.image }}"
          BUILD_ARGS=""
          if [ "${{ matrix.name }}" = "frontend" ]; then
            BUILD_ARGS="--build-arg NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${CLOUDINARY_NAME} --build-arg NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${CLOUDINARY_PRESET}"
          fi
          docker buildx build $BUILD_ARGS \
            --platform linux/amd64 \
            -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" \
            -f ${{ matrix.dockerfile }} ${{ matrix.context }} \
            --push

  deploy:
    name: Deploy to OKE
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OCI CLI
        uses: oracle-actions/configure-oci-cli@v1.3.2
        with:
          user: ${{ secrets.OCI_USER_OCID }}
          tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          privateKey: ${{ secrets.OCI_PRIVATE_KEY }}
          region: ${{ secrets.OCI_REGION }}

      - name: Bajar kubeconfig del OKE
        run: |
          mkdir -p ~/.kube
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ secrets.OKE_CLUSTER_ID }} \
            --file ~/.kube/config \
            --region ${{ secrets.OCI_REGION }} \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT

      - name: Sync app secrets from GitHub Secrets
        run: |
          kubectl create secret generic app-secrets -n sdypp \
            --from-literal=MP_ACCESS_TOKEN="${{ secrets.MP_ACCESS_TOKEN }}" \
            --from-literal=SESSION_PASSWORD="${{ secrets.SESSION_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tags and deploy
        run: |
          REGISTRY="${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}"
          cd k8s/gke/apps

          sed -i "s|image: IMAGE_TAG|image: ${REGISTRY}/blockchain-nct:${{ github.sha }}|" nct-deployment.yaml
          sed -i "s|image: IMAGE_TAG|image: ${REGISTRY}/blockchain-trp:${{ github.sha }}|" trp-deployment.yaml
          sed -i "s|image: IMAGE_TAG|image: ${REGISTRY}/blockchain-worker-cpu:${{ github.sha }}|" worker-cpu-deployment.yaml
          sed -i "s|image: IMAGE_TAG|image: ${REGISTRY}/frontend:${{ github.sha }}|" frontend-deployment.yaml

          kubectl apply -f .
