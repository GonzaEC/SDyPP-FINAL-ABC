name: "Pipeline 3 - Aplicaciones"

# Buildea las 4 imagenes (frontend, NCT, TrP, worker-cpu) para linux/amd64
# nativo, las pushea a Docker Hub publico (gonzaec/*) y las despliega al
# k3s Hetzner reemplazando el placeholder IMAGE_TAG en los manifests.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Pilar2/P5/**"
      - "k8s/gke/apps/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml

  build-and-push:
    name: Build ${{ matrix.name }}
    needs: gitleaks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            context: ./app
            dockerfile: ./app/Dockerfile
            image: frontend
          - name: nct
            context: ./Pilar2/P5
            dockerfile: ./Pilar2/P5/Dockerfile.api
            image: blockchain-nct
          - name: trp
            context: ./Pilar2/P5
            dockerfile: ./Pilar2/P5/Dockerfile.trp
            image: blockchain-trp
          - name: worker-cpu
            context: ./Pilar2/P5
            dockerfile: ./Pilar2/P5/Dockerfile.cpu
            image: blockchain-worker-cpu
    steps:
      - uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push linux/amd64
        env:
          # NEXT_PUBLIC_* se inlinean en build time por Next.js — solo
          # se pasan cuando el target es el frontend.
          CLOUDINARY_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}"
          BUILD_ARGS=""
          if [ "${{ matrix.name }}" = "frontend" ]; then
            BUILD_ARGS="--build-arg NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${CLOUDINARY_NAME} --build-arg NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${CLOUDINARY_PRESET}"
          fi
          docker build $BUILD_ARGS \
            -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" \
            -f ${{ matrix.dockerfile }} ${{ matrix.context }}
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

  deploy:
    name: Deploy al cluster k3s
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig del cluster k3s
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_HETZNER }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Sync app-secrets desde GitHub Secrets
        run: |
          kubectl create secret generic app-secrets -n sdypp \
            --from-literal=MP_ACCESS_TOKEN="${{ secrets.MP_ACCESS_TOKEN }}" \
            --from-literal=SESSION_PASSWORD="${{ secrets.SESSION_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Reemplazar IMAGE_TAG y aplicar manifests
        run: |
          REGISTRY="docker.io/${{ secrets.DOCKERHUB_USERNAME }}"
          cd k8s/gke/apps

          sed -i "s|image: IMAGE_TAG|image: ${REGISTRY}/blockchain-nct:${{ github.sha }}|" nct-deployment.yaml
          sed -i "s|image: IMAGE_TAG|image: ${REGISTRY}/blockchain-trp:${{ github.sha }}|" trp-deployment.yaml
          sed -i "s|image: IMAGE_TAG|image: ${REGISTRY}/blockchain-worker-cpu:${{ github.sha }}|" worker-cpu-deployment.yaml
          sed -i "s|image: IMAGE_TAG|image: ${REGISTRY}/frontend:${{ github.sha }}|" frontend-deployment.yaml

          kubectl apply -f .
