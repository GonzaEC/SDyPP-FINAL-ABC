name: "Pipeline 4 - Workers GPU (Cluster Profesor)"

on:
  push:
    branches: [main]
    paths:
      - "Pilar2/P5/worker.py"
      - "Pilar2/P5/gpu-server.py"
      - "Pilar2/P5/brute_force_range.cu"
      - "Pilar2/P5/Dockerfile.worker"
      # observability.py y requirements.txt se hornean en la imagen
      # (`COPY . .` y `pip install -r requirements.txt`), así que un cambio en
      # ellos debe redesplegar los workers GPU.
      - "Pilar2/P5/observability.py"
      - "Pilar2/P5/requirements.txt"
      - "k8s/profesor/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml

  build-gpu-image:
    name: Build GPU Worker Image
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to OCIR
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login \
            ${{ secrets.OCIR_REGISTRY }} \
            -u "${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_USERNAME }}" \
            --password-stdin

      # El cluster del profesor tiene GPUs x86; el build de la imagen GPU
      # queda x86 (nativo del runner).
      - name: Build and push GPU worker image
        run: |
          IMAGE="${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/blockchain-worker-gpu"
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" \
            -f Pilar2/P5/Dockerfile.worker Pilar2/P5/
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

  deploy-profesor:
    name: Deploy to Profesor Cluster
    needs: build-gpu-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROFESOR }}" | base64 -d > ~/.kube/config

      - name: Update image tags and deploy
        run: |
          REGISTRY="${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}"
          cd k8s/profesor

          sed -i "s|image: IMAGE_TAG|image: ${REGISTRY}/blockchain-worker-gpu:${{ github.sha }}|" gpu-server-deployment.yaml
          sed -i "s|image: IMAGE_TAG|image: ${REGISTRY}/blockchain-worker-gpu:${{ github.sha }}|" worker-deployment.yaml

          kubectl apply -f .
