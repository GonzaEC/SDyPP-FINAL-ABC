name: "Pipeline 4 - Workers GPU (Cluster Profesor)"

# Buildea la imagen del worker GPU (x86 nativo) y la despliega al cluster
# del profesor usando el kubeconfig que nos compartio.

on:
  push:
    branches: [main]
    paths:
      - "Pilar2/P5/worker.py"
      - "Pilar2/P5/gpu-server.py"
      - "Pilar2/P5/brute_force_range.cu"
      - "Pilar2/P5/Dockerfile.worker"
      # observability.py y requirements.txt se hornean en la imagen
      # (`COPY . .` y `pip install -r requirements.txt`), asi que un cambio en
      # ellos debe redesplegar los workers GPU.
      - "Pilar2/P5/observability.py"
      - "Pilar2/P5/requirements.txt"
      - "k8s/profesor/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml

  build-gpu-image:
    name: Build GPU Worker Image
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # El cluster del profesor tiene GPUs x86; el build queda x86 nativo del
      # runner (sin buildx).
      - name: Build + push imagen GPU
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/blockchain-worker-gpu"
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" \
            -f Pilar2/P5/Dockerfile.worker Pilar2/P5/
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

  deploy-profesor:
    name: Deploy al cluster del profesor
    needs: build-gpu-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig del profesor
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROFESOR }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Reemplazar IMAGE_TAG y aplicar
        run: |
          REGISTRY="docker.io/${{ secrets.DOCKERHUB_USERNAME }}"
          cd k8s/profesor

          sed -i "s|image: IMAGE_TAG|image: ${REGISTRY}/blockchain-worker-gpu:${{ github.sha }}|" gpu-server-deployment.yaml
          sed -i "s|image: IMAGE_TAG|image: ${REGISTRY}/blockchain-worker-gpu:${{ github.sha }}|" worker-deployment.yaml

          kubectl apply -f .
