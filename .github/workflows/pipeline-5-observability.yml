name: "Pipeline 5 - Observabilidad"

# Despliega el stack de observabilidad (Prometheus, Grafana, Loki, Tempo, Alloy,
# Alertmanager, exporters) al cluster OKE.
#
# Requisito: el nodo etiquetado `pool=monitoring` debe existir y estar tainteado.
# En OKE Always Free tenemos un unico node pool de 4 nodos; el bootstrap manual
# (documentado en k8s/README.md) etiqueta un nodo como monitoring y le agrega
# el taint monitoring=true:NoSchedule.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "k8s/gke/observability/**"
      - ".github/workflows/pipeline-5-observability.yml"
  workflow_run:
    workflows: ["Pipeline 1 - Infraestructura OKE"]
    types: [completed]

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml

  deploy-observability:
    name: Deploy stack LGTM
    needs: gitleaks
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OCI CLI
        uses: oracle-actions/configure-oci-cli@v1.3.2
        with:
          user: ${{ secrets.OCI_USER_OCID }}
          tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          privateKey: ${{ secrets.OCI_PRIVATE_KEY }}
          region: ${{ secrets.OCI_REGION }}

      - name: Bajar kubeconfig del OKE
        run: |
          mkdir -p ~/.kube
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ secrets.OKE_CLUSTER_ID }} \
            --file ~/.kube/config \
            --region ${{ secrets.OCI_REGION }} \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT

      - name: Verificar que hay un nodo monitoring
        run: |
          for i in $(seq 1 40); do
            ready=$(kubectl get nodes -l pool=monitoring --no-headers 2>/dev/null | grep -c " Ready ") || ready=0
            if [ "$ready" -ge 1 ]; then
              echo "$ready nodo(s) 'pool=monitoring' Ready."
              exit 0
            fi
            echo "Esperando nodo 'pool=monitoring'... ($i/40)"
            sleep 15
          done
          echo "::error::Ningun nodo con label pool=monitoring. Correr el bootstrap manual de labels/taints (ver k8s/README.md)."
          exit 1

      - name: Namespace + RBAC
        run: |
          kubectl apply -f k8s/gke/observability/namespace.yaml
          kubectl apply -f k8s/gke/observability/rbac.yaml

      - name: Deploy stack
        run: kubectl apply -f k8s/gke/observability/

      - name: Esperar rollout de Grafana/Prometheus
        run: |
          kubectl -n observability rollout status deploy/prometheus --timeout=300s
          kubectl -n observability rollout status deploy/grafana --timeout=300s
