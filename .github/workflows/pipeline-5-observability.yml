name: "Pipeline 5 - Observabilidad"

# Despliega el stack LGTM (Prometheus, Grafana, Loki, Tempo, Alloy,
# Alertmanager, exporters) al cluster k3s Hetzner.
#
# Al ser single-node, el nodo unico esta etiquetado `pool=apps` en el
# cloud-init de Terraform. Los manifests de observability tambien piden
# `pool=apps` (se colapsaron los 3 pools historicos a uno solo — ver
# ADR-029), asi que no hace falta bootstrap manual de labels.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "k8s/gke/observability/**"
      - ".github/workflows/pipeline-5-observability.yml"
  workflow_run:
    workflows: ["Pipeline 1 - Infraestructura Hetzner"]
    types: [completed]

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml

  deploy-observability:
    name: Deploy stack LGTM
    needs: gitleaks
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig del cluster k3s
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_HETZNER }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # Namespace y RBAC primero: el resto de los recursos viven en el ns
      # `observability` y `kubectl apply -f <dir>` ordena por nombre de archivo,
      # asi que sin esto algunos objetos se aplicarian antes de existir el ns.
      - name: Namespace + RBAC
        run: |
          kubectl apply -f k8s/gke/observability/namespace.yaml
          kubectl apply -f k8s/gke/observability/rbac.yaml

      - name: Deploy stack
        run: kubectl apply -f k8s/gke/observability/

      - name: Esperar rollout de Grafana y Prometheus
        run: |
          # 300s: la primera vez el nodo tiene que bajar las imagenes
          # (Prometheus, Grafana, Loki, Tempo), que no son chicas.
          kubectl -n observability rollout status deploy/prometheus --timeout=300s
          kubectl -n observability rollout status deploy/grafana --timeout=300s
