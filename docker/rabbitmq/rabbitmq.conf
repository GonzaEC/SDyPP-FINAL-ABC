# RabbitMQ para el entorno local (docker-compose).
#
# Es un espejo reducido de k8s/gke/infra/rabbitmq-config.yaml: mantiene lo que
# el código NECESITA (AMQP solo por TLS en 5671) y omite el tuning de memoria,
# que existe allá para no morir contra el limit de 512Mi del pod.
#
# Por qué TLS es obligatorio y no opcional: nct.py, trp.py y worker_cpu.py
# construyen la conexión con pika.ConnectionParameters(..., port=5671,
# ssl_options=...) sin ninguna rama de texto plano. No hay forma de hablarles
# por 5672, así que el broker local también tiene que ser TLS-only.
#
# Los certs son autofirmados y los genera el servicio `rabbitmq-certs` en cada
# `up`. Sirve porque ambos extremos verifican en modo "none": acá con
# ssl_options.verify = verify_none, y del lado de Python con ctx.verify_mode =
# ssl.CERT_NONE. Es adecuado para local; en GKE los certs vienen de un Secret.

listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /tls/rabbitmq-cert.pem
ssl_options.certfile   = /tls/rabbitmq-cert.pem
ssl_options.keyfile    = /tls/rabbitmq-key.pem
ssl_options.verify     = verify_none

management.ssl.port       = 15671
management.ssl.cacertfile = /tls/rabbitmq-cert.pem
management.ssl.certfile   = /tls/rabbitmq-cert.pem
management.ssl.keyfile    = /tls/rabbitmq-key.pem
