apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sdypp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        # El frontend expone /api/metrics (prom-client) en su puerto 3000.
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      # Endurecimiento del pod (checklist §3): sin root y con el perfil
      # seccomp por defecto del runtime.
      # El Dockerfile ya crea y usa el usuario nextjs (1001).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        pool: apps
      # El pool apps está tainteado (apps=true:NoSchedule, ver infra/gke.tf):
      # sin esta toleration el pod no podría programarse ahí. La separación de
      # pools pasa de "sugerida" (nodeSelector) a "impuesta" (taint+toleration).
      tolerations:
        - key: apps
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: frontend
          # Ningun servicio necesita capabilities del kernel ni escalar
          # privilegios. readOnlyRootFilesystem queda fuera a proposito: los
          # servicios de Python escriben __pycache__ y Postgres/RabbitMQ usan
          # rutas de trabajo dentro del contenedor.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: IMAGE_TAG
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          # Probes laxas: /api/health hace un SELECT 1 a Postgres y bajo carga
          # puede tardar más de 1s. Con probes agresivas, cualquier hipo de DB
          # mata el pod (cascade observado en producción cuando Postgres reinició).
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
