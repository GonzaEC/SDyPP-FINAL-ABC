apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: sdypp
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: sdypp
  annotations:
    # Le pide a cert-manager que emita/renueve el cert TLS via Let's Encrypt.
    # El ClusterIssuer letsencrypt-prod se define en cluster-issuer.yaml.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Traefik: redirige HTTP -> HTTPS via el Middleware https-redirect definido arriba.
    # (Reemplaza al annotation ssl-redirect de ingress-nginx.)
    traefik.ingress.kubernetes.io/router.middlewares: sdypp-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tesera.tech
      secretName: frontend-tls
  rules:
    - host: tesera.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
