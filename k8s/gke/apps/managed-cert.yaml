# Reemplaza al ManagedCertificate de GKE. cert-manager emite y renueva
# certificados de Let's Encrypt automaticamente contra el HTTP-01 challenge
# que resuelve el ingress-nginx (ver docs de bootstrap en k8s/README.md).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: gonzalocrenna28@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
