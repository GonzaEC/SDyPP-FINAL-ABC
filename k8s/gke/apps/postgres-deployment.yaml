apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sdypp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Endurecimiento del pod (checklist §3): sin root y con el perfil
      # seccomp por defecto del runtime.
      # postgres:17-alpine usa el uid 70. fsGroup para que el PVC quede accesible.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        pool: apps
      containers:
        - name: postgres
          # Ningun servicio necesita capabilities del kernel ni escalar
          # privilegios. readOnlyRootFilesystem queda fuera a proposito: los
          # servicios de Python escriben __pycache__ y Postgres/RabbitMQ usan
          # rutas de trabajo dentro del contenedor.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "entradas"
            - name: POSTGRES_PASSWORD
              value: "entradas"
            - name: POSTGRES_DB
              value: "entradas"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "entradas"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "entradas"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
