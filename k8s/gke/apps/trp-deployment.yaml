apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain-trp
  namespace: sdypp
spec:
  # 2 réplicas según consigna del TP. Es seguro porque:
  # - subdivide_and_publish y heartbeat_consumer consumen de colas RabbitMQ,
  #   que entrega cada mensaje a una sola réplica (round-robin nativo).
  # - monitor_loop usa Redis SET NX para que solo la primera réplica que
  #   detecta cambio de estado del gpu-server haga el trabajo de transición.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: blockchain-trp
  template:
    metadata:
      labels:
        app: blockchain-trp
      annotations:
        # TrP no es HTTP: observability.start_metrics_server() abre /metrics en 9000.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
    spec:
      # Endurecimiento del pod (checklist §3): sin root y con el perfil
      # seccomp por defecto del runtime.
      # La imagen python:3.12 corre como root si no se fuerza.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: trp-sa
      nodeSelector:
        pool: apps
      containers:
        - name: trp
          # Ningun servicio necesita capabilities del kernel ni escalar
          # privilegios. readOnlyRootFilesystem queda fuera a proposito: los
          # servicios de Python escriben __pycache__ y Postgres/RabbitMQ usan
          # rutas de trabajo dentro del contenedor.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: IMAGE_TAG
          ports:
            - name: metrics
              containerPort: 9000
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
