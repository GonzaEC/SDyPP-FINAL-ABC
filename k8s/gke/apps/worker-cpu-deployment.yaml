apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain-worker-cpu
  namespace: sdypp
spec:
  replicas: 0
  selector:
    matchLabels:
      app: blockchain-worker-cpu
  template:
    metadata:
      labels:
        app: blockchain-worker-cpu
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
    spec:
      # Endurecimiento del pod (checklist §3): sin root y con el perfil
      # seccomp por defecto del runtime.
      # La imagen python:3.12 corre como root si no se fuerza.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        pool: apps
      # Toleration a apps=true:NoSchedule. En el VPS single-node de Hetzner no
      # hay taints reales — el cloud-init solo etiqueta el nodo con pool=apps
      # (infra/server.tf) — asi que hoy es un no-op inofensivo y lo que programa
      # el pod es el nodeSelector de arriba. Se conserva porque la separación de
      # pools con taints es la intención arquitectónica declarada (ADR-029).
      # Importante: el TrP escala este deployment vía la API de Kubernetes;
      # los pods nuevos también llevan la toleration y programan igual.
      tolerations:
        - key: apps
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: worker-cpu
          # Ningun servicio necesita capabilities del kernel ni escalar
          # privilegios. readOnlyRootFilesystem queda fuera a proposito: los
          # servicios de Python escriben __pycache__ y Postgres/RabbitMQ usan
          # rutas de trabajo dentro del contenedor.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: IMAGE_TAG
          ports:
            - name: metrics
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: app-config
          # El ConfigMap compartido apunta a 4318 porque lo consume el frontend
          # con @vercel/otel (OTLP/HTTP). Los servicios Python exportan por gRPC
          # (observability.py:170), asi que sin este override el exporter no
          # conecta. Las entradas de `env` pisan a las de `envFrom`.
          # OTEL_SERVICE_NAME no se toca: observability.py:189 pasa el nombre
          # explicito a Resource.create(), la env no aplica para estos servicios.
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.observability.svc.cluster.local:4317"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
