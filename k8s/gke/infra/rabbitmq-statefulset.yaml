apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: sdypp
spec:
  replicas: 1
  serviceName: rabbitmq
  selector:
    matchLabels:
      app: rabbitmq
  # RabbitMQ persistía colas/datos solo en memoria; un volumeClaimTemplate le da
  # storage por réplica (PVC propio) para sobrevivir reinicios.
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  template:
    metadata:
      labels:
        app: rabbitmq
      annotations:
        # El plugin rabbitmq_prometheus expone /metrics en 15692 (HTTP plano).
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
    spec:
      # Endurecimiento del pod (checklist §3): sin root y con el perfil
      # seccomp por defecto del runtime.
      # La imagen rabbitmq usa el uid 999. fsGroup para leer los certs TLS montados.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        pool: infra
      # El pool infra NO lleva taint a propósito (ver infra/gke.tf): los addons
      # gestionados de GKE (kube-dns, metrics-server) solo toleran CriticalAddonsOnly
      # y necesitan al menos un pool sin taint. Infra es la landing zone de esos
      # pods; Redis/RabbitMQ siguen guiados por nodeSelector.
      containers:
        - name: rabbitmq
          # Ningun servicio necesita capabilities del kernel ni escalar
          # privilegios. readOnlyRootFilesystem queda fuera a proposito: los
          # servicios de Python escriben __pycache__ y Postgres/RabbitMQ usan
          # rutas de trabajo dentro del contenedor.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: rabbitmq:3-management
          ports:
            - containerPort: 5671
            - containerPort: 15671
            - containerPort: 15692 # métricas Prometheus
          volumeMounts:
            - name: rabbitmq-storage
              mountPath: /var/lib/rabbitmq
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
      volumes:
        - name: tls
          secret:
            secretName: rabbitmq-tls
        - name: config
          configMap:
            name: rabbitmq-config