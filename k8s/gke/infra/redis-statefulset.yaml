apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sdypp
spec:
  replicas: 1
  serviceName: redis
  selector:
    matchLabels:
      app: redis
  # Redis guarda el AOF en el volumen de la réplica 0 (PVC migrado desde el
  # Deployment). Un volumeClaimTemplate permite replicar con PVC por réplica.
  volumeClaimTemplates:
    - metadata:
        name: redis-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  template:
    metadata:
      labels:
        app: redis
    spec:
      # Endurecimiento del pod (checklist §3): sin root y con el perfil
      # seccomp por defecto del runtime.
      # La imagen redis usa el uid 999. fsGroup para el PVC del AOF.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        pool: infra
      # El pool infra NO lleva taint a propósito (ver infra/gke.tf): los addons
      # gestionados de GKE (kube-dns, metrics-server) solo toleran CriticalAddonsOnly
      # y necesitan al menos un pool sin taint. Infra es la landing zone de esos
      # pods; Redis/RabbitMQ siguen guiados por nodeSelector.
      containers:
        - name: redis
          # Ningun servicio necesita capabilities del kernel ni escalar
          # privilegios. readOnlyRootFilesystem queda fuera a proposito: los
          # servicios de Python escriben __pycache__ y Postgres/RabbitMQ usan
          # rutas de trabajo dentro del contenedor.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: redis:7
          # --maxmemory por debajo del limit del cgroup (256Mi) para que Redis
          # se autolimite ANTES de que el kernel lo OOM-killee. noeviction: si
          # igual se llenara, los writes fallan ruidosamente en vez de evictar
          # blockchain/op:*/ownership en silencio (esos datos NO se pueden
          # perder). La fuga real (lista "logs") la acota el logs-janitor del
          # NCT; esto es la red de seguridad de infra (bug C1).
          command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: redis-storage
              mountPath: /data